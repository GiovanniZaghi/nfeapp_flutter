name: nfeapp_flutter
description: "Ecommerce Flutter App."
publish_to: 'Lucas Henrique'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  share_plus: ^10.0.0
  cupertino_icons: ^1.0.8
  flutter_lints: ^5.0.0
  get_it: ^8.0.3
  flutter_bloc: ^9.0.0
  http: ^1.3.0
  flutter_dotenv: ^5.2.1
  equatable: ^2.0.5
  get: ^4.6.6
  flutter_localization: ^0.3.1
  blurrycontainer: ^2.1.0
  top_snackbar_flutter: ^3.2.0
  fl_chart: ^0.70.2
  local_auth: ^2.3.0
  shared_preferences: ^2.2.2
  board_datetime_picker: ^2.5.0
  dio: ^5.8.0+1
  dropdown_search: ^5.0.6

  sqflite: ^2.2.8+4
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.3.2
  match_generator: ^0.4.2
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_app.jpeg"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
